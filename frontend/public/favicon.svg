<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Nox's mark: a crescent cut out of a disc, the same shape as LogoMark.
       index.html has pointed here since the first commit and the file was never
       written, so every tab has carried the browser's blank page icon.

       Explicit width and height, unlike the component: a favicon is loaded as
       an image rather than laid out, and an SVG with only a viewBox has no
       intrinsic size to draw at. -->
  <defs>
    <mask id="c">
      <rect width="32" height="32" fill="black"/>
      <circle cx="16" cy="16" r="13" fill="white"/>
      <circle cx="22" cy="13" r="11" fill="black"/>
    </mask>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="13" fill="url(#g)" mask="url(#c)"/>
  <circle cx="24" cy="24" r="2" fill="#c7d2fe" opacity="0.9"/>
</svg>
