<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nox by Limbo</title>
    <script>
      // Set the palette before the first paint, or the page shows one ground
      // and then repaints to another. The key and the default MUST match
      // src/theme.ts — they disagreed once and every load flashed.
      (function () {
        try {
          var t = localStorage.getItem("nox-theme") || "midnight";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "midnight");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
