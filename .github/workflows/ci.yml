# The gates this project already had, run by something other than a person
# remembering to.
#
# Every regression this repo has had was one of four things: a type error, a
# description that came back from the editor subtly rewritten, a rule that
# reached for a design token instead of naming a value, or a permission check
# that was right on four screens and wrong on two. All four fail here.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      # `npm run build` is roundtrip → tsc → vite, in that order and for that
      # reason: a description silently rewritten on save is worse than a build
      # that does not finish, so it is checked before anything else runs.
      - name: builds, types check, descriptions survive a round trip
        run: npm run build
        working-directory: frontend

      # Separate step, so a design-system failure reads as one rather than as
      # part of a build log. Exits non-zero — see the note at the end of the
      # file it runs.
      - name: design system
        run: node m3_audit.mjs src
        working-directory: frontend

      # Reports only. Dead CSS is worth knowing about and never worth failing a
      # branch over — it is tidiness, not correctness.
      - name: dead css
        run: node prune_css.mjs src
        working-directory: frontend
        continue-on-error: true

  backend:
    name: backend
    runs-on: ubuntu-latest

    # A real Postgres, because everything these tests are about is something
    # Postgres does: twenty-seven foreign keys, visibility compiling to SQL, a
    # unique constraint refusing a second account. A stand-in that enforced none
    # of those would pass the suite while the real thing failed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nox
          POSTGRES_PASSWORD: nox
          POSTGRES_DB: nox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend

      # The suite makes its own database and drops it, so it never touches
      # whatever else is on the server.
      - name: auth, rate limiting and permissions
        run: python -m pytest
        working-directory: backend
        env:
          NOX_TEST_ADMIN_URL: postgresql://nox:nox@localhost:5432/postgres
