; Alembic — migrations for the tracker's Postgres schema only.
; The rest of the app is SQLite and manages itself; nothing here touches it.
;
; The URL is NOT set here. It comes from TRACKER_DATABASE_URL at runtime (see
; alembic/env.py), because live has no database configured and must not be
; migrated into existence by accident.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
